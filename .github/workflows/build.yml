name: Build StudyOS Debug APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Both StudyOS APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Dynamic Version from Gradle
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          BUILD=$(grep 'versionCode = ' app/build.gradle.kts | head -n 1 | sed 's/[^0-9]*//g')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.${{ github.run_number }}"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$BUILD" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          echo "Detected StudyOS version: $VERSION (Build: $BUILD)"

      - name: Build Both Release & Debug APKs with Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon

      - name: Verify & Prepare Direct APKs
        run: |
          echo "Listing all generated APK files:"
          find app/build/outputs/apk/ -name "*.apk"
          
          # Prefer signed release APKs, fallback to debug APKs
          CA_APK=$(find app/build/outputs/apk/cainter/ -name "*release.apk" | head -n 1)
          if [ -z "$CA_APK" ]; then
            CA_APK=$(find app/build/outputs/apk/cainter/ -name "*.apk" | head -n 1)
          fi
          echo "Using CA Inter APK: $CA_APK"
          cp "$CA_APK" StudyOS-CAInter.apk
          
          CUSTOM_APK=$(find app/build/outputs/apk/custom/ -name "*release.apk" | head -n 1)
          if [ -z "$CUSTOM_APK" ]; then
            CUSTOM_APK=$(find app/build/outputs/apk/custom/ -name "*.apk" | head -n 1)
          fi
          echo "Using Custom APK: $CUSTOM_APK"
          cp "$CUSTOM_APK" StudyOS-Custom.apk
          
          # Copy to release folder
          mkdir -p release
          cp StudyOS-CAInter.apk release/StudyOS-CAInter.apk
          cp StudyOS-Custom.apk release/StudyOS-Custom.apk

      - name: Upload Debug APKs Artifact (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: StudyOS-Both-APKs
          path: |
            StudyOS-CAInter.apk
            StudyOS-Custom.apk
          retention-days: 30

      - name: Publish Direct APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "StudyOS ${{ env.TAG_NAME }} (Build ${{ env.APP_BUILD }})"
          body: |
            ### 📱 Direct APK Downloads
            * **StudyOS-CAInter.apk**: Dedicated app for ICAI CA Intermediate (Rahul's routine + 7-Day Study Graph)
            * **StudyOS-Custom.apk**: Dedicated app for other students/friends with custom schedule types, subjects & graph
            * **Autonomous Release**: Build ${{ env.APP_BUILD }} automatically published on git push.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            StudyOS-CAInter.apk
            StudyOS-Custom.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Direct APKs to Repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/StudyOS-CAInter.apk release/StudyOS-Custom.apk
          if git diff --staged --quiet; then
            echo "No changes in APK binaries"
          else
            git commit -m "chore: add direct downloadable StudyOS-CAInter.apk and StudyOS-Custom.apk [skip ci]"
            git push origin main
          fi

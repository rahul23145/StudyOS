name: Build StudyOS Debug APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Both StudyOS APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Both Debug APKs with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify & Prepare Direct APKs
        run: |
          echo "Listing all generated APK files:"
          find app/build/outputs/apk/ -name "*.apk"
          
          # Copy CA Inter edition
          cp $(find app/build/outputs/apk/cainter/ -name "*debug.apk" | head -n 1) StudyOS-CAInter.apk
          
          # Copy Custom edition
          cp $(find app/build/outputs/apk/custom/ -name "*debug.apk" | head -n 1) StudyOS-Custom.apk
          
          # Copy to release folder
          mkdir -p release
          cp StudyOS-CAInter.apk release/StudyOS-CAInter.apk
          cp StudyOS-Custom.apk release/StudyOS-Custom.apk

      - name: Upload Debug APKs Artifact (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: StudyOS-Both-APKs
          path: |
            StudyOS-CAInter.apk
            StudyOS-Custom.apk
          retention-days: 30

      - name: Publish Direct APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.1.0
          name: "StudyOS v1.1.0 (Direct APKs with Study Graph)"
          body: |
            ### 📱 Direct APK Downloads (No Unzipping Required)
            * **StudyOS-CAInter.apk**: Dedicated app for ICAI CA Intermediate (Rahul's routine + 7-Day Study Graph)
            * **StudyOS-Custom.apk**: Dedicated app for other students/friends with custom schedule types, subjects & graph
          draft: false
          prerelease: false
          files: |
            StudyOS-CAInter.apk
            StudyOS-Custom.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Direct APKs to Repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/StudyOS-CAInter.apk release/StudyOS-Custom.apk
          if git diff --staged --quiet; then
            echo "No changes in APK binaries"
          else
            git commit -m "chore: add direct downloadable StudyOS-CAInter.apk and StudyOS-Custom.apk [skip ci]"
            git push origin main
          fi
